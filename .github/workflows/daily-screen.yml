name: Daily drop-flat screen

on:
  push:
    # Feature branch is included temporarily so archive changes can be CI-validated.
    branches: [master, feat/daily-market-archive]
    paths-ignore:
      - "results/**"
      - "market_data/**"
  schedule:
    # 00:30 EST / 01:30 EDT, after Massive Basic releases EOD data.
    - cron: "30 5 * * 2-6"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-drop-flat-screen
  cancel-in-progress: false

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # A rerun belongs to the original run SHA. Always start from the
          # latest triggering branch so the report commit remains fast-forwardable.
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore market-data cache
        uses: actions/cache@v4
        with:
          path: .cache/massive
          key: massive-eod-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            massive-eod-${{ runner.os }}-

      - name: Run tests
        run: python3 -m unittest -v test_screener.py test_archive_market_data.py

      - name: Screen market
        env:
          MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
        run: python3 screener.py run --config config.example.json --output-dir results --max-results 50

      - name: Archive and backfill full-market grouped EOD data
        run: >-
          python3 archive_market_data.py
          --all-cached
          --results-json results/latest.json
          --cache-dir .cache/massive
          --archive-dir market_data/us
          --min-results 1000

      - name: Commit dated report and market archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/ market_data/us/
          if git diff --cached --quiet; then
            echo "No report or market archive change to commit"
          else
            AS_OF=$(python3 -c 'import json; print(json.load(open("results/latest.json"))["as_of"])')
            git commit -m "report: ${AS_OF} screen + full-market archive"
            git push
          fi

      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        with:
          name: drop-flat-candidates-${{ github.run_number }}
          path: results/
          if-no-files-found: error
          retention-days: 30

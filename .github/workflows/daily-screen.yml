name: Daily drop-flat screen

on:
  schedule:
    - cron: "15 23 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore market-data cache
        uses: actions/cache@v4
        with:
          path: .cache/massive
          key: massive-eod-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            massive-eod-${{ runner.os }}-

      - name: Run tests
        run: python3 -m unittest -v test_screener.py

      - name: Screen market
        env:
          MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
        run: python3 screener.py run --config config.example.json --output-dir reports

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: drop-flat-candidates-${{ github.run_number }}
          path: reports/
          if-no-files-found: error
          retention-days: 30

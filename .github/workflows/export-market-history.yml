name: Export market history
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/export-market-history.yml'
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate public market archive for 2026-09-18 research
        run: |
          python3 - <<'PY'
          import json, gzip, hashlib
          from pathlib import Path
          p = Path('market_data/us/manifest.json')
          m = json.loads(p.read_text())
          dates = sorted(d for d in m['archives'] if d <= '2026-09-17')
          assert dates, 'Empty archive'
          print('Market history:', len(dates), 'dates;', dates[0], 'through', dates[-1])
          for d in dates:
              fp = p.parent / m['archives'][d]['path']
              assert fp.is_file(), d
              with gzip.open(fp, 'rt') as f:
                  raw = json.load(f)
              assert len(raw.get('results', [])) >= 1000, d
          print('Validated all selected grouped files. No private portfolio data included.')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: public-market-research-inputs-20260918
          path: market_data/us/
          compression-level: 0
          retention-days: 7

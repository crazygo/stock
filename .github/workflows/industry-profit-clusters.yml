name: Industry and profitability clusters

on:
  push:
    branches: [feat/industry-profit-clusters]
    paths:
      - "enrich_industry_profit.py"
      - "test_industry_profit.py"
      - ".github/workflows/industry-profit-clusters.yml"
  pull_request:
    branches: [master]
    paths:
      - "enrich_industry_profit.py"
      - "test_industry_profit.py"
      - ".github/workflows/industry-profit-clusters.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: industry-profit-clusters-${{ github.ref }}
  cancel-in-progress: false

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore SEC fundamentals cache
        uses: actions/cache@v4
        with:
          path: .cache/sec
          key: sec-fundamentals-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            sec-fundamentals-${{ runner.os }}-

      - name: Run tests
        run: python3 -m unittest -v test_industry_profit.py

      - name: Enrich industry and profitability structure
        env:
          SEC_USER_AGENT: "crazygo-stock-research/1.0 crazygo@users.noreply.github.com"
        run: >-
          python3 enrich_industry_profit.py
          --input analysis/apr_may_peak/analysis.json
          --output-dir analysis/apr_may_peak
          --fundamentals-out fundamentals/sec/apr_may_peak_2026-08-20.json
          --cache-dir .cache/sec
          --request-delay 0.20

      - name: Upload enrichment outputs
        uses: actions/upload-artifact@v4
        with:
          name: industry-profit-clusters-${{ github.run_number }}
          path: |
            analysis/apr_may_peak/industry_profit_analysis.json
            analysis/apr_may_peak/industry_profit_report.md
            analysis/apr_may_peak/enriched_stocks.csv
            fundamentals/sec/apr_may_peak_2026-08-20.json
          if-no-files-found: error
          retention-days: 30

      - name: Commit enrichment outputs
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- analysis/apr_may_peak/industry_profit_analysis.json analysis/apr_may_peak/industry_profit_report.md analysis/apr_may_peak/enriched_stocks.csv fundamentals/sec/apr_may_peak_2026-08-20.json
          if git diff --cached --quiet; then
            echo "No enrichment changes to commit"
          else
            git commit -m "analysis: add industry and profitability clusters"
            git push
          fi

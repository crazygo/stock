name: Optical-primary universe

on:
  push:
    branches:
      - feat/optical-universe
    paths:
      - "optical_universe.py"
      - "optical_universe.json"
      - "test_optical_universe.py"
      - ".github/workflows/optical-universe.yml"
  pull_request:
    branches:
      - master
    paths:
      - "optical_universe.py"
      - "optical_universe.json"
      - "test_optical_universe.py"
      - ".github/workflows/optical-universe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run optical-universe tests
        run: python3 -m unittest -v test_optical_universe.py

      - name: Build strict U.S. + Hong Kong optical universe
        run: python3 optical_universe.py --fetch-quotes --output-dir results/optical

      - name: Upload optical universe
        uses: actions/upload-artifact@v4
        with:
          name: optical-primary-universe
          path: results/optical/
          if-no-files-found: error
          retention-days: 30

name: Probe Massive financials

on:
  push:
    branches: [feat/industry-profit-clusters]
    paths:
      - "probe_massive_financials.py"
      - ".github/workflows/probe-massive-financials.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/industry-profit-clusters
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Probe entitlement
        env:
          MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
        run: python3 probe_massive_financials.py | tee .massive-financials-probe.json
      - name: Persist probe result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- .massive-financials-probe.json
          git commit -m "ci: record Massive financials entitlement" || exit 0
          git push origin HEAD:feat/industry-profit-clusters

name: Recluster weekly-peak class on all matches

on:
  push:
    branches: [fix/wave-clustering-all-market]
    paths:
      - "patch_wave_clustering_fit.py"
      - "recluster_existing_wave_analysis.py"
      - ".github/workflows/recluster-all-market.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: recluster-weekly-peak-all-matches
  cancel-in-progress: false

jobs:
  recluster:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Patch canonical analyzer to fit all matches
        run: python3 patch_wave_clustering_fit.py

      - name: Run existing wave tests
        run: python3 -m unittest -v test_historical_wave.py

      - name: Recluster committed analysis without redownloading market data
        run: python3 recluster_existing_wave_analysis.py --analysis-dir analysis/apr_may_peak

      - name: Validate fit population
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path('analysis/apr_may_peak/analysis.json').read_text())
          assert payload['clustering_fit_population'] == 'all_matches'
          assert sum(group['count'] for group in payload['groups']) == payload['match_count'] == 463
          assert payload['clustering']['k'] >= 3
          print(payload['clustering'])
          PY

      - name: Commit canonical analyzer and corrected outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- analyze_apr_may_peak.py analysis/apr_may_peak/
          if git diff --cached --quiet; then
            echo "No clustering correction to commit"
          else
            git commit -m "analysis: fit pullback groups on all matches"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

        const allChartObjects = [];
        let isSyncing = false;

        document.getElementById('paramMaxPullback').addEventListener('input', function(e) {
            document.getElementById('valPullback').innerText = parseFloat(e.target.value).toFixed(1) + '%';
        });

        function detectMultiDaySurges(candles, minDays, maxPullbackPct, minSurgePct) {
            const n = candles.length;
            const surges = [];
            let i = 0;

            while (i < n - minDays) {
                let startIdx = i;
                let peakPrice = candles[startIdx].close;
                let peakIdx = startIdx;
                let j = startIdx + 1;

                while (j < n) {
                    const curClose = candles[j].close;
                    const curHigh = candles[j].high;
                    if (curHigh > peakPrice) {
                        peakPrice = curHigh;
                        peakIdx = j;
                    }
                    const pullback = (peakPrice - curClose) / peakPrice;
                    if (pullback > maxPullbackPct) {
                        break;
                    }
                    j++;
                }

                const endIdx = peakIdx;
                const days = endIdx - startIdx + 1;
                const totalSurge = (candles[endIdx].high - candles[startIdx].low) / candles[startIdx].low;

                if (days >= minDays && totalSurge >= minSurgePct) {
                    surges.push({
                        startDate: candles[startIdx].date,
                        endDate: candles[endIdx].date,
                        startIdx: startIdx,
                        endIdx: endIdx,
                        days: days,
                        gainPct: (totalSurge * 100).toFixed(1)
                    });
                    i = endIdx + 1;
                } else {
                    i++;
                }
            }
            return surges;
        }

        function createChartCard(item, containerEl, isLeft) {
            const minDays = parseInt(document.getElementById('paramMinDays').value) || 5;
            const maxPullback = (parseFloat(document.getElementById('paramMaxPullback').value) || 5) / 100.0;
            const minSurge = (parseFloat(document.getElementById('paramMinReturn').value) || 10) / 100.0;
            const surges = detectMultiDaySurges(item.candles, minDays, maxPullback, minSurge);

            const card = document.createElement('div');
            card.className = 'chart-card ' + (isLeft ? 'card-left' : 'card-right');
            card.id = 'card-' + item.ticker;

            const chgBadge = item.chg_june_july < 0 
                ? `<span style="color:#f87171;font-weight:700">6~7月: ${item.chg_june_july}%</span>`
                : `<span style="color:#4ade80;font-weight:700">6~7月: +${item.chg_june_july}%</span>`;

            card.innerHTML = `
                <div class="chart-header">
                    <div>
                        <span class="chart-title">${item.ticker}</span>
                        <span class="chart-subtitle">${item.name} (${item.sector})</span>
                        <span style="margin-left:8px;font-size:11px;">${chgBadge}</span>
                    </div>
                    <div class="surge-tags" id="tags-${item.ticker}"></div>
                </div>
                <div class="chart-view" id="view-${item.ticker}"></div>
            `;
            containerEl.appendChild(card);

            const tagsBox = card.querySelector('#tags-' + item.ticker);
            surges.forEach(s => {
                tagsBox.innerHTML += `<span class="surge-tag">🔥 ${s.days}天 +${s.gainPct}%</span>`;
            });
            if (surges.length === 0) {
                tagsBox.innerHTML = `<span style="font-size:11px;color:#64748b;">无符合区间</span>`;
            }

            const chartContainer = card.querySelector('#view-' + item.ticker);
            const chart = LightweightCharts.createChart(chartContainer, {
                layout: {
                    background: { color: '#1e293b' },
                    textColor: '#94a3b8',
                },
                grid: {
                    vertLines: { color: '#334155' },
                    horzLines: { color: '#334155' },
                },
                crosshair: {
                    mode: LightweightCharts.CrosshairMode.Normal,
                },
                rightPriceScale: {
                    mode: LightweightCharts.PriceScaleMode.Logarithmic, // 1. 纵轴使用对数坐标系
                    borderColor: '#475569',
                },
                timeScale: {
                    borderColor: '#475569',
                    timeVisible: true,
                    secondsVisible: false,
                },
            });

            const candleSeries = chart.addCandlestickSeries({
                upColor: '#ef4444',
                downColor: '#22c55e',
                borderVisible: false,
                wickUpColor: '#ef4444',
                wickDownColor: '#22c55e',
            });

            candleSeries.setData(item.candles.map(c => ({
                time: c.date,
                open: c.open,
                high: c.high,
                low: c.low,
                close: c.close
            })));

            const markers = [];
            surges.forEach(s => {
                markers.push({ time: s.startDate, position: 'belowBar', color: '#22c55e', shape: 'arrowUp', text: '起爆' });
                markers.push({ time: s.endDate, position: 'aboveBar', color: '#f59e0b', shape: 'arrowDown', text: '+' + s.gainPct + '%' });
            });
            candleSeries.setMarkers(markers);
            chart.timeScale().fitContent();

            // 2. 各个图的缩放同步 (Cross-chart zoom & scroll sync)
            chart.timeScale().subscribeVisibleLogicalRangeChange(range => {
                if (isSyncing || !range) return;
                isSyncing = true;
                for (const other of allChartObjects) {
                    if (other.chart !== chart) {
                        other.chart.timeScale().setVisibleLogicalRange(range);
                    }
                }
                isSyncing = false;
            });

            allChartObjects.push({ chart, series: candleSeries, candles: item.candles, ticker: item.ticker });
        }

        function initAll() {
            const leftCol = document.getElementById('leftCol');
            const rightCol = document.getElementById('rightCol');
            
            LEFT_STOCKS.forEach(stk => createChartCard(stk, leftCol, true));
            RIGHT_STOCKS.forEach(stk => createChartCard(stk, rightCol, false));
        }

        function recalcAllSurges() {
            const minDays = parseInt(document.getElementById('paramMinDays').value) || 5;
            const maxPullback = (parseFloat(document.getElementById('paramMaxPullback').value) || 5) / 100.0;
            const minSurge = (parseFloat(document.getElementById('paramMinReturn').value) || 10) / 100.0;

            for (const obj of allChartObjects) {
                const surges = detectMultiDaySurges(obj.candles, minDays, maxPullback, minSurge);
                const tagsBox = document.getElementById('tags-' + obj.ticker);
                if (tagsBox) {
                    tagsBox.innerHTML = '';
                    surges.forEach(s => {
                        tagsBox.innerHTML += `<span class="surge-tag">🔥 ${s.days}天 +${s.gainPct}%</span>`;
                    });
                    if (surges.length === 0) {
                        tagsBox.innerHTML = `<span style="font-size:11px;color:#64748b;">无符合区间</span>`;
                    }
                }
                const markers = [];
                surges.forEach(s => {
                    markers.push({ time: s.startDate, position: 'belowBar', color: '#22c55e', shape: 'arrowUp', text: '起爆' });
                    markers.push({ time: s.endDate, position: 'aboveBar', color: '#f59e0b', shape: 'arrowDown', text: '+' + s.gainPct + '%' });
                });
                obj.series.setMarkers(markers);
            }
        }

        window.onload = initAll;
    </script>

<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<style>
  body { font-family: -apple-system, system-ui, "Segoe UI", sans-serif; margin: 0; color: #222; background: #fff; }
  header, main { padding: 10px 16px; }
  header { border-bottom: 1px solid #bbb; }
  h1 { font-size: 18px; margin: 0 0 6px; }
  .meta { font-size: 12px; color: #444; line-height: 1.6; }
  .warn { border: 1px solid #999; background: #f3f3f3; padding: 6px 8px; margin: 6px 0; font-size: 13px; }
  .badge { display: inline-block; border: 1px solid #888; padding: 0 6px; margin-right: 4px; font-size: 12px; }
  #mapwrap { max-width: 760px; }
  svg { display: block; width: 100%; height: auto; }
  .axis text, .tick { font-size: 10px; fill: #555; }
  .pt { cursor: pointer; }
  .lbl { font-size: 9px; fill: #333; pointer-events: none; }
  fieldset { border: 1px solid #bbb; font-size: 12px; margin: 6px 0; }
  .frow { margin: 3px 0; line-height: 1.9; }
  .frow b { display: inline-block; min-width: 64px; }
  .frow label { white-space: nowrap; margin-right: 8px; }
  .frow button { font-size: 11px; margin-right: 4px; }
  #fcount { font-size: 12px; color: #333; }
  #unknown button, #chooser button { margin: 2px; font-size: 12px; }
  #panel { position: fixed; top: 0; right: 0; width: 620px; max-width: 100%; height: 100%; overflow: auto; background: #fff;
           border-left: 1px solid #888; box-shadow: -2px 0 6px rgba(0,0,0,.15); padding: 10px 14px; box-sizing: border-box; }
  #panel[hidden] { display: none; }
  #panel h2 { font-size: 16px; margin: 4px 0; }
  #close { float: right; font-size: 16px; }
  table { border-collapse: collapse; font-size: 12px; width: 100%; }
  td, th { border: 1px solid #ccc; padding: 2px 4px; text-align: left; vertical-align: top; }
  .legend span { display: inline-block; margin-right: 10px; font-size: 12px; }
  .sw { display: inline-block; width: 14px; height: 3px; vertical-align: middle; margin-right: 3px; }
  .ranges button[aria-pressed="true"] { font-weight: bold; border-width: 2px; }
  @media (max-width: 760px) {
    #panel { top: auto; bottom: 0; width: 100%; height: 78vh; border-left: 0; border-top: 1px solid #888; }
    header, main { padding: 8px; }
  }
</style>
</head>
<body>
<header>
  <h1 id="title"></h1>
  <div class="meta" id="meta"></div>
  <div id="banners"></div>
</header>
<main>
  <fieldset id="filters"><legend>筛选（不改变坐标）</legend></fieldset>
  <div id="mapwrap"><svg id="map" viewBox="0 0 640 470" role="img" aria-label="V-G 地图"></svg></div>
  <div class="meta">横轴 V 波动幅度（asinh(V/0.20)，刻度为实际年化值），纵轴 G 长期方向（asinh(G/0.50)）。
    颜色 = M（蓝 反向 / 灰 接近零 / 橙 延续 / 白 未知）；形状 = J（圆 较分散 / 菱形 较集中 / 十字 未知）；
    外环 = S（实线 较稳定 / 虚线 较易变 / 点线 未知）。* = 价格未到评估截止（沿用较早收盘）。坐标轴固定，不随本次股票自动缩放。</div>
  <h3 style="font-size:14px">无地图坐标（G 或 V 未知）——仍可查看详情</h3>
  <div id="unknown"></div>
</main>
<aside id="panel" hidden aria-label="证券详情">
  <button id="close" aria-label="关闭">×</button>
  <div id="chooser"></div>
  <div id="detail"></div>
</aside>
<script type="application/json" id="data">__DATA_JSON__</script>
<script>/*VIEW_LOGIC*/</script>

    var p = s.points.filter(function (x) { return x.date === selDate; })[0];

    [['评估截止', p.date], ['价格截至', (p.price_asof || '—') + (p.stale_sessions.length ? '（缺 ' + p.stale_sessions.join(', ') + '）' : '')], ['计算时间（北京）', p.computed_at], ['模式', p.mode === 'live' ? 'live 实际运行' : '历史回算'], ['report_run_id', p.report_run_id], ['data_run_id', p.data_run_id], ['连续收盘数', p.contiguous_closes === undefined ? '—' : p.contiguous_closes], ['修订历史', s.superseded_versions.length ? s.superseded_versions.map(function (v) { return v.date + ' ' + v.report_run_id; }).join('; ') : '无']].forEach(function (r) { var tr = h('tr', '', info); h('th', r[0], tr); h('td', String(r[1]), tr); });

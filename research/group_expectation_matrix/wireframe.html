<style>

*{box-sizing:border-box}body{margin:0;max-width:100%;overflow-wrap:anywhere}button,input,select{font:inherit;color:inherit}button,select,input{border:1px solid var(--rule);background:var(--paper);border-radius:2px;padding:7px 10px}button{cursor:pointer}button:hover{background:var(--soft)}:focus-visible{outline:2px solid var(--focus);outline-offset:3px}a{color:inherit;text-underline-offset:3px}h1,h2,h3,p{margin:0}h1{font-size:26px;font-weight:650;letter-spacing:-.7px}h2{font-size:18px;font-weight:650}h3{font-size:15px}small,.muted{color:var(--muted)}code,.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px}header{background:var(--paper);border-bottom:1px solid var(--rule);padding:22px 28px;display:flex;align-items:center;justify-content:space-between;gap:20px}.brand{display:flex;flex-direction:column;gap:5px}.stamp{font-size:11px;letter-spacing:1px;color:var(--muted)}.actions{display:flex;gap:8px;flex-wrap:wrap}.page{max-width:1800px;margin:auto;padding:20px 28px;display:flex;flex-direction:column;gap:18px}.overview{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));border:1px solid var(--rule);background:var(--paper)}.overview div{padding:12px 16px;border-right:1px solid var(--rule)}.overview div:last-child{border:0}.overview strong{display:block;font-size:22px;font-weight:600}.overview span{font-size:12px;color:var(--muted)}nav{display:flex;gap:6px;flex-wrap:wrap}nav button{border-color:transparent;background:transparent}nav button[aria-selected="true"]{border-color:var(--ink);background:var(--paper);font-weight:650}.note{border:1px dashed var(--rule);padding:10px 14px;background:var(--paper);font-size:12px;color:var(--muted)}.toolbar{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;background:var(--paper);border:1px solid var(--rule);padding:12px}.control{display:flex;flex-direction:column;gap:4px;font-size:12px}.control input,.control select{max-width:240px;font-size:13px}.checkbox{display:flex;gap:6px;align-items:center;padding-bottom:7px}.workspace{display:grid;grid-template-columns:minmax(0,1fr) 335px;gap:16px;align-items:start}.panel{background:var(--paper);border:1px solid var(--rule);min-width:0}.panel-top{padding:13px 15px;border-bottom:1px solid var(--rule);display:flex;flex-direction:column;gap:4px}.panel-body{padding:16px;display:flex;flex-direction:column;gap:14px}.table-scroll{overflow-x:auto;max-width:100%;overscroll-behavior-x:contain}table{border-collapse:collapse;width:100%;font-size:12px}caption{text-align:left;padding:10px 15px;color:var(--muted);font-size:12px}th,td{padding:9px 11px;border-bottom:1px solid var(--soft);text-align:right;vertical-align:middle}th{font-weight:550;background:#f8f8f8}th:first-child,td:first-child{text-align:left}#matrix{min-width:840px;table-layout:fixed}#matrix th:first-child,#matrix td:first-child{width:220px;position:sticky;left:0;background:var(--paper);z-index:1;border-right:1px solid var(--soft)}#matrix thead th{background:#eee}#matrix td{padding:4px}#matrix td:first-child{padding:9px 12px}#matrix .group-heading{font-size:11px;letter-spacing:.2px;background:#eee;text-align:left;color:var(--muted);padding:7px 12px;font-weight:500;position:static}#matrix .cell{display:flex;flex-direction:column;align-items:flex-end;justify-content:center;width:100%;min-height:65px;padding:7px 9px;border:1px solid transparent;background:rgba(0,0,0,var(--shade,0));border-radius:0}#matrix .cell:hover,#matrix .cell.selected{border-color:#222}#matrix .cell strong{font-size:17px;font-weight:550}#matrix .cell small{font-size:10px;white-space:nowrap}.empty{padding:25px;text-align:center;color:var(--muted)}.group-name{font-weight:550}.group-sub{font-size:10px;color:var(--muted)}.metric-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.metric-grid span{display:block;font-size:11px;color:var(--muted)}.metric-grid strong{font-size:20px;font-weight:550}.divider{border-top:1px solid var(--soft);padding-top:12px}.tags{display:flex;gap:5px;flex-wrap:wrap}.tag{border:1px solid var(--rule);padding:2px 6px;font-size:11px;background:#fafafa}.detail-copy{font-size:12px;display:flex;flex-direction:column;gap:6px}.detail-copy ul{margin:0;padding-left:17px}.comparison{display:grid;grid-template-columns:1fr auto;gap:8px;font-size:12px}.mini-chart{display:flex;flex-direction:column;gap:8px}.month-bar{display:grid;grid-template-columns:55px minmax(0,1fr) 45px;gap:8px;align-items:center;font-size:11px}.track{background:var(--soft);height:8px}.fill{background:#707070;height:100%}.status-label{font-size:11px;border:1px dashed var(--rule);padding:3px 7px;display:inline-block}.hidden,[hidden]{display:none!important}.two-col{display:grid;grid-template-columns:minmax(250px,1fr) minmax(0,2fr);gap:16px}.list-button{width:100%;text-align:left;border:0;border-bottom:1px solid var(--soft);border-radius:0;padding:12px 15px}.list-button.active{background:#e8e8e8}.section-stack{display:flex;flex-direction:column;gap:16px}.report{max-width:1050px;display:flex;flex-direction:column;gap:16px}.finding{padding:20px;border:1px solid var(--rule);background:var(--paper);display:flex;flex-direction:column;gap:10px}.finding p{max-width:85ch}.finding details{font-size:12px}.finding summary{cursor:pointer}.finding pre{white-space:pre-wrap;max-height:240px;overflow:auto;background:var(--ground);padding:12px;font-size:11px}.source-list{display:flex;flex-direction:column;gap:6px;padding-left:18px;font-size:12px}.contract-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.contract-grid ul{padding-left:18px;margin:0}.footer{color:var(--muted);font-size:11px;display:flex;justify-content:space-between;gap:15px;border-top:1px solid var(--rule);padding-top:12px}.detail-title{display:flex;flex-direction:column;gap:4px}.counter{font-size:11px;color:var(--muted)}.small-table th,.small-table td{font-size:11px;padding:6px}.archive-list{max-height:600px;overflow:auto}.coverage-table{min-width:650px}#detail{position:sticky;top:12px;max-height:calc(100vh - 24px);overflow:auto}#notice{min-height:20px;font-size:12px;color:var(--muted)}
@media(max-width:1150px){.workspace{grid-template-columns:minmax(0,1fr)}#detail{position:static;max-height:none}.metric-grid{grid-template-columns:repeat(4,minmax(0,1fr))}.overview{grid-template-columns:repeat(3,1fr)}.overview div:nth-child(3){border-right:0}.overview div:nth-child(-n+3){border-bottom:1px solid var(--rule)}}
@media(max-width:650px){header{padding:17px;align-items:flex-start;flex-direction:column;gap:12px}h1{font-size:23px}.page{padding:14px;gap:14px}.overview div{padding:10px}.overview strong{font-size:19px}.overview span{font-size:10px}.toolbar{gap:10px}.control{flex:1 1 140px}.control select,.control input{width:100%;max-width:none}.two-col,.contract-grid{grid-template-columns:1fr}.metric-grid{grid-template-columns:1fr 1fr}.footer{flex-direction:column}nav button{padding:7px}.archive-list{max-height:240px}.finding{padding:15px}.panel-body{padding:13px}.actions button{font-size:12px}.checkbox{font-size:12px}}

</head>
<body>
<header><div class="brand"><div class="stamp">RESEARCH WORKSPACE / LOW-FIDELITY WIREFRAME</div><h1>群 × 期望</h1><p class="muted">找到共性，再观察共性在不同目标下的表现。</p></div><div class="actions"><button id="export-current">导出当前矩阵 JSON</button><button id="export-all">导出结构化数据</button></div></header>
<main class="page">
<section class="overview" id="overview" aria-label="数据规模"></section>
<div class="note" id="scope-note"></div>
<nav role="tablist" aria-label="研究视图"><button role="tab" aria-selected="true" data-view="matrix-view">二维矩阵</button><button role="tab" aria-selected="false" data-view="groups-view">群与版本</button><button role="tab" aria-selected="false" data-view="insights-view">模型洞察</button><button role="tab" aria-selected="false" data-view="method-view">口径与数据</button></nav>
<section id="matrix-view" role="tabpanel" class="section-stack">
<div class="toolbar"><label class="control">分组策略<select id="strategy"><option value="*">全部策略</option></select></label><label class="control">成员版本范围<select id="week"><option value="all">历史各周 · 按当周归属聚合</option></select></label><label class="control">单元格指标<select id="metric"><option value="hit_rate">历史达成率</option><option value="lift">相对同日期全池增量</option><option value="mean_net_proxy">平均研究净评价</option><option value="es95_loss">净评价尾损 ES95</option><option value="mae_q10">全窗口 MAE 第10百分位</option><option value="mean_holding_days_proxy">平均占用交易日代理</option></select></label><label class="control">查找群或证券<input id="search" type="search" placeholder="例如：存储、6 月、NVDA"></label><label class="checkbox"><input id="sufficient" type="checkbox">仅显示有成熟样本的群</label><button id="reset">重置</button></div>
<div class="workspace"><section class="panel"><div class="panel-top"><h2 id="matrix-title">历史各周的成员归属 × 收益期望</h2><p class="muted" id="matrix-subtitle"></p></div><div class="table-scroll"><table id="matrix" aria-label="群与达成期望矩阵"></table></div><div class="panel-body detail-copy"><p>每格：指标值 / 命中数 ÷ 成熟样本数。点选查看分母、同日期基准、风险、成员与月份变化。</p><p>灰度仅辅助比较；空格代表未分类或无成熟样本，不代表 0% 达成率。不同群可能重叠。</p></div></section><aside class="panel" id="detail" aria-live="polite"></aside></div>
</section>
<section id="groups-view" role="tabpanel" hidden><div class="two-col"><section class="panel"><div class="panel-top"><h2>群档案</h2><p class="muted">策略定义固定，成员按周形成版本。</p></div><div class="archive-list" id="group-list"></div></section><section class="panel" id="group-profile"></section></div></section>
<section id="insights-view" role="tabpanel" hidden><div class="report" id="insights"></div></section>
<section id="method-view" role="tabpanel" hidden><div id="method" class="section-stack"></div></section>
<div id="notice" role="status" aria-live="polite"></div>
<footer class="footer"><span>结构评审：矩阵总览 → 单元格证据 → 群版本 → 模型解释。颜色与品牌设计暂缓。</span><span id="footer-time"></span></footer>
</main>
<script>
"use strict";
const DATA = /*__BUNDLE__*/null;
const $ = id => document.getElementById(id);
const esc = v => String(v ?? '').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pct = (v,d=1) => v == null ? '—' : (v*100).toFixed(d)+'%';
const pp = v => v == null ? '—' : (v>=0?'+':'')+(v*100).toFixed(1)+' pp';
const num = v => v == null ? '—' : Number(v).toLocaleString('zh-CN');
const dayfmt = v => v == null ? '—' : v.toFixed(2)+' 日';
const map = new Map(DATA.cells.map(c=>[[c.scope,c.group_id,c.expectation_id].join('|'),c]));
const groupMap = new Map(DATA.groups.map(g=>[g.group_id,g]));
const strategyMap = new Map(DATA.strategies.map(g=>[g.strategy_id,g]));
const expMap = new Map(DATA.expectations.map(e=>[e.expectation_id,e]));
const instrumentMap = new Map((DATA.instruments||[]).map(i=>[i.symbol,i]));
const industrySummary = () => DATA.manifest.industry_parent_group_count ? `${DATA.manifest.industry_parent_group_count} 个父群 + ${DATA.manifest.industry_subgroup_count} 个子群 · 平级展示` : `${DATA.industry_refinement?.length||0} 类拆为 ${DATA.manifest.industry_group_count} 个平级群`;
function relationsCopy(g){const ids=g.parent_group_id?[g.parent_group_id]:(g.child_group_ids||[]);if(!ids.length)return '';return `<div class="detail-copy divider"><h3>${g.parent_group_id?'所属父群':'关联子群'}</h3><div class="tags">${ids.map(id=>`<button class="related-group" data-related-group="${esc(id)}">${esc(groupMap.get(id)?.name||id)}</button>`).join('')}</div>${g.group_kind==='parent'?'<p>父群成员按子群并集去重，每个股票日只计算一次。</p>':''}</div>`;}
let chosen = ['all:all','d3_r5'];
let profileGroup = 'trend_15:up';
const state = () => ({scope:$('week').value,strategy:$('strategy').value,metric:$('metric').value,search:$('search').value.trim().toUpperCase(),sufficient:$('sufficient').checked});
const cellFor = (g,e,scope=state().scope) => map.get([scope,g,e].join('|'));
function memberRows(gid,scope){return DATA.memberships.filter(m=>m.group_ids.includes(gid)&&(scope==='all'||m.week_id===scope));}
function filteredGroups(){const s=state();return DATA.groups.filter(g=>{if(s.strategy!=='*'&&g.strategy_id!==s.strategy)return false;if(s.sufficient&&!DATA.expectations.some(e=>cellFor(g.group_id,e.expectation_id)?.mature_n))return false;if(!s.search)return true;return [g.name,g.description,g.group_id].join(' ').toUpperCase().includes(s.search)||memberRows(g.group_id,s.scope).some(m=>m.symbol.includes(s.search));});}
function value(c){if(!c)return null;return state().metric==='lift'?c.market_comparison?.lift:c[state().metric];}
function formatValue(v){return state().metric==='lift'?pp(v):state().metric==='mean_holding_days_proxy'?dayfmt(v):pct(v);}
function renderMatrix(){const s=state(),groups=filteredGroups();if(!groups.some(g=>g.group_id===chosen[0])&&groups.length)chosen=[groups[0].group_id,chosen[1]];$('matrix-title').textContent=s.scope==='all'?'历史各周的成员归属 × 收益期望':s.scope+' · 当周成员 × 收益期望';$('matrix-subtitle').textContent=`${groups.length} 个群 · ${DATA.expectations.length} 种期望 · 每只证券每天 11:30 ET 一次观察 · ${$('metric').selectedOptions[0].textContent}`;let html='<thead><tr><th scope="col">群 / 分组策略</th>'+DATA.expectations.map(e=>`<th scope="col">${esc(e.name)}<br><small>${e.trading_days*390} 常规分钟</small></th>`).join('')+'</tr></thead><tbody>';let prev='';for(const g of groups){if(g.strategy_id!==prev){prev=g.strategy_id;html+=`<tr><th colspan="${DATA.expectations.length+1}" class="group-heading" scope="rowgroup">${esc(strategyMap.get(prev).name)} · 定义 ${esc(strategyMap.get(prev).definition_version)}${prev==='industry'?' · 当前行业快照回溯'+(DATA.industry_refinement?.length?` · ${industrySummary()}`:''):''}</th></tr>`;}const stocks=new Set(memberRows(g.group_id,s.scope).map(m=>m.symbol));html+=`<tr><th scope="row"><div class="group-name">${esc(g.name)}</div><div class="group-sub">${g.group_kind==='parent'?'父群 · ':g.group_kind==='subgroup'?'子群 · ':g.group_kind==='watchlist'?'自选群 · ':''}${stocks.size} 只曾属该群${g.group_kind==='watchlist'?` · ${DATA.manifest.etf_market_data_ready_count} 只有行情`:''}${s.scope==='all'?' · 跨周':''}${g.strategy_id==='industry'&&stocks.size<5?' · 少于5股':''}</div></th>`;for(const e of DATA.expectations){const c=cellFor(g.group_id,e.expectation_id),v=value(c);const shade=s.metric!=='hit_rate'||c?.hit_rate==null?0:Math.min(.19,c.hit_rate*.23);html+=`<td><button class="cell ${chosen[0]===g.group_id&&chosen[1]===e.expectation_id?'selected':''}" data-group="${esc(g.group_id)}" data-expectation="${e.expectation_id}" style="--shade:${shade}" aria-label="${esc(g.name)}，${esc(e.name)}，${esc(formatValue(v))}"><strong>${formatValue(v)}</strong><small>${c?.mature_n?num(c.hit_n)+' / '+num(c.mature_n):'无成熟样本'}</small></button></td>`;}html+='</tr>';}html+='</tbody>';$('matrix').innerHTML=html+(groups.length?'':'<caption>没有匹配的群。修改证券、群名称或筛选条件。</caption>');if(!groups.length){$('detail').innerHTML='<div class="panel-body">没有匹配的群，请修改筛选条件。</div>';return;}renderDetail();}
function compareLine(title,c){return `<div class="comparison"><span>${title}</span><strong>${pct(c?.baseline_rate)} / ${pp(c?.lift)}</strong></div>`;}
function renderDetail(){const [gid,eid]=chosen,g=groupMap.get(gid),e=expMap.get(eid),c=cellFor(gid,eid),s=state();if(!g||!c){$('detail').innerHTML='<div class="panel-body">请选择一个单元格。</div>';return;}const comparison=c.market_comparison||{};const latest=s.scope==='all'?DATA.weeks.at(-1).week_id:s.scope;const latestMembers=memberRows(gid,latest);const ci=comparison.lift_ci95?comparison.lift_ci95.map(pp).join(' 至 '):'样本不足 / 周级不估区间';const monthly=DATA.month_cells.filter(m=>m.group_id===gid&&m.expectation_id===eid&&m.mature_n);const stock=DATA.stock_cells.filter(m=>m.group_id===gid&&m.expectation_id===eid&&m.mature_n).sort((a,b)=>b.hit_rate-a.hit_rate);let html=`<div class="panel-top detail-title"><h2>${esc(g.name)}</h2><p>${esc(e.name)} · ${s.scope==='all'?'历史周版本聚合':esc(s.scope)}</p></div><div class="panel-body">${relationsCopy(g)}<div class="metric-grid"><div><span>历史达成率</span><strong>${pct(c.hit_rate)}</strong></div><div><span>同日期全池增量</span><strong>${pp(comparison.lift)}</strong></div><div><span>命中 / 成熟</span><strong style="font-size:16px">${num(c.hit_n)} / ${num(c.mature_n)}</strong></div><div><span>${g.strategy_id==='watchlist_etf'?'可评估 ETF / 日期':'证券 / 日期'}</span><strong style="font-size:16px">${c.stock_n} / ${c.date_n}</strong></div></div><div class="detail-copy divider"><p>观察范围：${c.date_from||'—'} → ${c.date_to||'—'}</p><p>全部归属观察 ${num(c.sample_count)}；待成熟 ${num(c.pending_n)}；缺失或公司行动 ${num(c.missing_n)}。</p>${g.strategy_id==='watchlist_etf'?`<p>分组 ${g.member_symbols.length} 只ETF；${DATA.manifest.etf_market_data_unavailable_count} 只无完整5分钟行情或公司行动表，统计只使用可评估成员。</p>`:''}<p>发行人/证券代理 ${num(c.issuer_n)}；最大单证券占比 ${pct(c.max_stock_share)}；证券等权达成 ${pct(c.stock_equal_hit_rate)}。</p></div><div class="detail-copy divider"><h3>同日期对照</h3>${compareLine('全池基准 / 增量',comparison)}${compareLine('本策略可分组池 / 增量',c.eligible_comparison)}<p>增量的探索性 95% 区间：${ci}。未做多重检验校正，不作为独立通过证据。</p></div><div class="detail-copy divider"><h3>目标之外的代价</h3><div class="comparison"><span>平均研究净评价</span><strong>${pct(c.mean_net_proxy,2)}</strong><span>净评价尾损 ES95</span><strong>${pct(c.es95_loss)}</strong><span>全窗口 MAE 第10百分位</span><strong>${pct(c.mae_q10)}</strong><span>平均占用交易日代理</span><strong>${dayfmt(c.mean_holding_days_proxy)}</strong><span>命中者达成耗时中位数</span><strong>${dayfmt(c.hit_median_days)}</strong><span>全窗口期末收益均值</span><strong>${pct(c.mean_terminal_return,2)}</strong></div><p>净评价按触及目标卖出代理，否则按期末估值，双边各 6bp；不设途中止损。不是资金组合收益，MAE 不是账户回撤。</p></div>`;
if(s.scope==='all'){html+=`<div class="detail-copy divider"><h3>月份稳定性 · 历史达成率</h3><div class="mini-chart">${monthly.map(m=>`<div class="month-bar"><span>${m.month}</span><div class="track"><div class="fill" style="width:${m.hit_rate*100}%"></div></div><span>${pct(m.hit_rate,0)}</span></div>`).join('')||'无成熟月份'}</div><p>各月份只使用该月当时归属该群的样本。</p></div><details class="detail-copy divider"><summary>逐证券历史统计（${stock.length} 只，跨周）</summary><div class="table-scroll"><table class="small-table"><thead><tr><th>股票</th><th>达成率</th><th>成熟数</th><th>净评价</th></tr></thead><tbody>${stock.map(m=>`<tr><td>${m.symbol}</td><td>${pct(m.hit_rate)}</td><td>${m.mature_n}</td><td>${pct(m.mean_net_proxy,2)}</td></tr>`).join('')}</tbody></table></div></details>`;}
html+=`<div class="detail-copy divider"><h3>${latest} 成员快照</h3><div class="tags">${latestMembers.map(m=>`<span class="tag">${m.symbol}</span>`).join('')||'<span class="muted">本周没有可分类成员</span>'}</div><p>${s.scope==='all'?'此列表是最新周成员；上方指标使用每个历史周自身的成员。':'指标仅聚合本周这些成员的观察。'}</p><button id="open-profile">打开群与版本档案</button></div></div>`;$('detail').innerHTML=html;$('open-profile').onclick=()=>{profileGroup=gid;showView('groups-view');renderGroups();};}
function showView(id){document.querySelectorAll('[role="tabpanel"]').forEach(el=>el.hidden=el.id!==id);document.querySelectorAll('[role="tab"]').forEach(b=>b.setAttribute('aria-selected',b.dataset.view===id?'true':'false'));}
function renderGroups(){const g=groupMap.get(profileGroup)||DATA.groups[0];profileGroup=g.group_id;const strategy=strategyMap.get(g.strategy_id);$('group-list').innerHTML=DATA.groups.map(x=>`<button class="list-button ${x.group_id===profileGroup?'active':''}" data-profile="${esc(x.group_id)}"><strong>${esc(x.name)}</strong><br><small>${esc(strategyMap.get(x.strategy_id).name)}</small></button>`).join('');const versions=DATA.versions.filter(v=>v.strategy_id===g.strategy_id).slice().reverse();const selected=state().scope==='all'?DATA.weeks.at(-1).week_id:state().scope;const members=memberRows(profileGroup,selected);const sources=g.sources||[];const allRows=DATA.memberships.filter(m=>m.strategy_id===g.strategy_id&&m.week_id===selected);const statuses={};allRows.forEach(m=>statuses[m.status]=(statuses[m.status]||0)+1);$('group-profile').innerHTML=`<div class="panel-top"><h2>${esc(g.name)}</h2><p>${esc(g.description)}</p></div><div class="panel-body"><div class="metric-grid"><div><span>策略定义版本</span><strong style="font-size:15px">${esc(strategy.definition_version)}</strong></div><div><span>当前查看周</span><strong style="font-size:15px">${selected}</strong></div></div><div class="detail-copy"><p>策略 ID：<code>${esc(g.strategy_id)}</code>；群 ID：<code>${esc(g.group_id)}</code></p><p>更新：每周首个交易日开盘前，用此前完整行情重建；历史版本是今日重放。</p>${g.strategy_id==='industry'?'<p>行业多标签：当前业务资料回溯。每周复制来源快照不代表重新核验业务，也不证明股价价值传导。</p>':''}${g.strategy_id==='watchlist_etf'?`<p>FutuD 自选群为 ${esc(DATA.watchlist_snapshot.observed_at)} 的当前快照回溯；${DATA.manifest.etf_market_data_unavailable_count} 只ETF缺所需行情或公司行动元数据，仅保留实体和缺失状态。</p>`:''}<p>本策略当周资格：${Object.entries(statuses).map(([k,v])=>esc(k)+' '+v+'只').join(' / ')}</p></div>${relationsCopy(g)}<h3>本周成员 · ${members.length} 只</h3><div class="tags">${members.map(m=>`<span class="tag" title="${esc(instrumentMap.get(m.symbol)?.market_data_status||JSON.stringify(m.facts))}">${m.symbol}${instrumentMap.get(m.symbol)?.instrument_type==='etf'?' · ETF':''}${instrumentMap.get(m.symbol)?.market_data_status==='5m_or_action_metadata_unavailable'?' · 缺行情':''}</span>`).join('')||'没有可分类成员'}</div><div class="table-scroll"><table class="coverage-table"><caption>每周版本；成员有增减，群定义保持可追溯</caption><thead><tr><th>周</th><th>群成员数</th><th>策略可分类数</th><th>版本 ID</th></tr></thead><tbody>${versions.map(v=>`<tr><td><button class="select-week" data-week="${v.week_id}">${v.week_id}</button></td><td>${memberRows(profileGroup,v.week_id).length}</td><td>${v.classified_stocks}</td><td class="mono">${esc(v.version_id)}</td></tr>`).join('')}</tbody></table></div>${sources.length?`<details><summary>官方业务来源（${sources.length}）</summary><ul class="source-list">${sources.map(x=>`<li><a href="${esc(x.url)}" target="_blank" rel="noopener noreferrer">${esc(x.title)}</a> · ${esc(x.supports.join(', '))}</li>`).join('')}</ul></details>`:''}</div>`;}
function evidenceValue(e){return typeof e.value==='number'?String(e.value):JSON.stringify(e.value);}
function renderInsights(){const ins=DATA.insights;if(!ins){$('insights').innerHTML='<div class="finding"><h2>独立模型分析尚未写入本制品</h2><p>矩阵数据已经计算；分析完成后重新运行渲染命令即可纳入该页。</p></div>';return;}let html=`<div class="finding"><h2>独立模型的交叉分析</h2><p>${esc(ins.summary)}</p><p class="muted">分析者：${esc(ins.analyst)} · ${esc(ins.analyzed_at)}。以下解释来自冻结统计，未训练新的预测模型。</p></div>`;for(const f of ins.findings){html+=`<article class="finding"><h3>${esc(f.title)}</h3><p>${esc(f.claim)}</p><p>${esc(f.interpretation)}</p><details><summary>核对结构化证据（${f.evidence?.length||0} 项）</summary><pre>${esc(JSON.stringify(f.evidence,null,2))}</pre></details><p class="muted">边界：${esc(Array.isArray(f.limitations)?f.limitations.join('；'):f.limitations)}</p><p>下一步：${esc(f.next_test)}</p>${f.evidence?.find(x=>groupMap.has(x.group_id)&&expMap.has(x.expectation_id))?(()=>{const ev=f.evidence.find(x=>groupMap.has(x.group_id)&&expMap.has(x.expectation_id));return `<button class="inspect-evidence" data-group="${esc(ev.group_id)}" data-expectation="${esc(ev.expectation_id)}">查看对应矩阵单元格</button>`;})():''}</article>`;}html+=`<div class="finding"><h3>这份数据尚不支持的结论</h3><ul>${(ins.rejected_claims||[]).map(x=>`<li>${esc(typeof x==='string'?x:JSON.stringify(x))}</li>`).join('')}</ul></div>`;$('insights').innerHTML=html;}
function renderMethod(){const m=DATA.manifest,c=DATA.config;$('method').innerHTML=`<div class="contract-grid"><section class="panel"><div class="panel-top"><h2>群的时间与身份</h2></div><div class="panel-body"><p>策略定义 → 每周版本 → 群成员；一个股票可同时有行业、价值链与多周期趋势标签。</p><ul><li>趋势 3 周 / 3 月 / 6 月 = 15 / 63 / 126 个交易日。</li><li>趋势用累计对数收益除以日收益波动×√期限，阈值 ±1；这是描述性尺度。</li><li>波动分界 20% / 40% 年化；流动性分界 5,000 万 / 2 亿美元日成交额。</li><li>每周归属只使用周开始之前已完成并可用的行情。</li>${DATA.industry_refinement?.length?`<li>${industrySummary()}；子群名称用 - 表达细分。一只股票仍可多标签归属。</li>${m.industry_parent_group_count?'<li>父群与子群都有独立 ID、成员和统计。父群取子群成员的去重并集；父子群的统计不能相加。</li>':''}`:''}<li>行业覆盖 ${m.industry_classified_stocks}/${m.stock_candidate_count||m.candidate_stocks} 只股票；未覆盖不补造标签。</li>${m.etf_candidate_count?`<li>FutuD ETF群 ${m.etf_candidate_count} 只；${m.etf_market_data_ready_count} 只有本地5分钟行情及公司行动表，其余缺失不计目标失败。</li>`:''}</ul></div></section><section class="panel"><div class="panel-top"><h2>期望与每日观察</h2></div><div class="panel-body"><ul><li>每天 11:30 ET 决策；计算与人工延迟后通常 11:35 入场，使用该 5m bar 的 Open。</li><li>N 日 = N×390 常规交易分钟；休市不计、半日按实际分钟累计。</li><li>目标事件：完整窗口内 High 触及入场价×(1+目标收益)。</li><li>提前触及仍需等待完整窗口成熟；缺失与未成熟不填失败。</li><li>无途中止损。未触及时期末估值不是强制卖出承诺。</li></ul></div></section><section class="panel"><div class="panel-top"><h2>比较与不确定性</h2></div><div class="panel-body"><p>各格与同一批成熟日期的全池基准比较，并按该群每日成熟数加权；另列本策略有资格分组证券的基准。</p><p>区间按连续日期块整体重采样，块长至少覆盖标签期限。少于足够日期或证券时不报告区间。</p><p>多群、多期望的探索尚未多重检验校正，且原有历史已被研究过；没有独立预测有效性结论。</p></div></section><section class="panel"><div class="panel-top"><h2>数据边界</h2></div><div class="panel-body"><ul>${m.limitations.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div></section></div><section class="panel"><div class="panel-top"><h2>可复用的结构化对象</h2></div><div class="panel-body"><div class="table-scroll"><table><thead><tr><th>对象</th><th>关键字段</th><th>用途</th></tr></thead><tbody><tr><td>strategies.json</td><td>strategy_id / definition_version / cadence</td><td>分组规则</td></tr><tr><td>versions.json</td><td>version_id / week_id / feature_cutoff_at</td><td>每周快照</td></tr><tr><td>memberships.json</td><td>symbol / group_ids[] / version_id / facts</td><td>多标签成员关系</td></tr><tr><td>expectations.json</td><td>target_return / trading_days</td><td>达成期望</td></tr><tr><td>matrix.json</td><td>group_id / expectation_id / scope / metrics</td><td>二维表及周版本</td></tr><tr><td>outcomes.parquet</td><td>sample_id / status / hit / path metrics</td><td>逐样本复算</td></tr><tr><td>manifest.json</td><td>config / source hashes / code hashes</td><td>数据与代码溯源</td></tr></tbody></table></div><p>协议：<code>${esc(m.protocol_version)}</code>；配置 SHA256：<code>${esc(m.config_sha256)}</code></p><p>行情截止：${esc(m.evaluation_as_of)}；生成：${esc(m.generated_at)}。</p></div></section>`;}
function download(name,obj){const url=URL.createObjectURL(new Blob([JSON.stringify(obj,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);$('notice').textContent='已导出 '+name;}
function init(){document.addEventListener('click',event=>{const b=event.target.closest('[data-related-group]');if(!b)return;chosen=[b.dataset.relatedGroup,chosen[1]];profileGroup=chosen[0];$('strategy').value=groupMap.get(chosen[0]).strategy_id;$('search').value='';$('sufficient').checked=false;showView('matrix-view');renderMatrix();renderGroups();});const m=DATA.manifest;$('overview').innerHTML=[[m.candidate_stocks,m.etf_candidate_count?'候选证券 / '+m.stock_candidate_count+' 股票 + '+m.etf_candidate_count+' ETF':'候选证券 / '+m.issuer_count+' 发行人'],[m.strategy_count,'分组策略'],[m.group_count,'群 · 多标签可重叠'],[m.expectation_count,'达成期望'],[m.version_count,'策略周版本 / '+m.week_count+' 周'],[num(m.unique_stock_days),'证券 × 日期观察']].map(([n,t])=>`<div><strong>${n}</strong><span>${esc(t)}</span></div>`).join('');$('scope-note').textContent=`当前名单回溯 · ${m.sample_start} 至 ${m.sample_end} · 历史达成率，不是未来概率。行业为当前业务快照回溯；行情分组为各周当时信息重建。${m.etf_candidate_count?` FutuD ETF当前组 ${m.etf_candidate_count} 只，其中 ${m.etf_market_data_unavailable_count} 只缺所需行情/公司行动数据。`:''}`;for(const s of DATA.strategies)$('strategy').add(new Option(s.name,s.strategy_id));for(const w of DATA.weeks.slice().reverse())$('week').add(new Option(w.week_id+' · '+w.first_session,w.week_id));$('footer-time').textContent='计算生成 '+m.generated_at.slice(0,19).replace('T',' ')+' UTC';['strategy','week','metric','sufficient'].forEach(id=>$(id).addEventListener('change',()=>{renderMatrix();renderGroups();}));$('search').addEventListener('input',renderMatrix);$('reset').onclick=()=>{$('strategy').value='*';$('week').value='all';$('metric').value='hit_rate';$('search').value='';$('sufficient').checked=false;chosen=['all:all','d3_r5'];renderMatrix();};document.querySelectorAll('[role="tab"]').forEach(b=>b.onclick=()=>showView(b.dataset.view));$('matrix').onclick=event=>{const b=event.target.closest('[data-group]');if(!b)return;chosen=[b.dataset.group,b.dataset.expectation];renderMatrix();};$('group-list').onclick=event=>{const b=event.target.closest('[data-profile]');if(!b)return;profileGroup=b.dataset.profile;renderGroups();};$('group-profile').onclick=event=>{const b=event.target.closest('[data-week]');if(!b)return;$('week').value=b.dataset.week;renderGroups();renderMatrix();};$('insights').onclick=event=>{const b=event.target.closest('.inspect-evidence');if(!b)return;$('strategy').value='*';$('week').value='all';$('search').value='';chosen=[b.dataset.group,b.dataset.expectation];showView('matrix-view');renderMatrix();};$('export-current').onclick=()=>{const ids=new Set(filteredGroups().map(g=>g.group_id));download('group-expectation-matrix-'+state().scope+'.json',{manifest:DATA.manifest,filters:state(),groups:DATA.groups.filter(g=>ids.has(g.group_id)),expectations:DATA.expectations,cells:DATA.cells.filter(c=>c.scope===state().scope&&ids.has(c.group_id))});};$('export-all').onclick=()=>download('group-expectation-bundle.json',DATA);renderMatrix();renderGroups();renderInsights();renderMethod();}
init();
</script>
